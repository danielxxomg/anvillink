name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2025.9.6
      - name: Gradle build
        run: |
          export GRADLE_USER_HOME="$PWD/.gradle"
          mise x java@21.0.2 -- ./gradlew clean build spotlessCheck
      - name: Verify JAR
        if: always()
        run: |
          unzip -p build/libs/anvillink-*.jar plugin.yml | head -n 5
          jar tf build/libs/anvillink-*.jar | grep -q "io/github/danielxxomg/anvillink/libs/kyori/adventure/text/serializer/legacy/LegacyComponentSerializer" || (echo "missing relocated legacy serializer" && exit 1)
          if jar tf build/libs/anvillink-*.jar | grep -q "^net/kyori"; then echo "unrelocated net/kyori present" && exit 1; fi
          if jar tf build/libs/anvillink-*.jar | grep -q "^org/bukkit"; then echo "host org/bukkit packaged" && exit 1; fi
          if jar tf build/libs/anvillink-*.jar | grep -q "^net/minecraft/server"; then echo "host net/minecraft packaged" && exit 1; fi
          jar tf build/libs/anvillink-*.jar | grep -c "paper\|vault" || true
